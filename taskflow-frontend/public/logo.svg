<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Glowing Checkmark Arrow Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="80%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Hexagon / Shield Badge -->
  <path d="M 256,36 L 440,140 L 440,372 L 256,476 L 72,372 L 72,140 Z"
        fill="url(#bgGrad)"
        stroke="url(#borderGrad)"
        stroke-width="12"
        stroke-linejoin="round"
        rx="24" />

  <!-- Inner Soft Hexagon Outline -->
  <path d="M 256,56 L 420,150 L 420,362 L 256,456 L 92,362 L 92,150 Z"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.06"
        stroke-width="4" />

  <!-- TaskFlow Checkmark + Flow Arrow Emblem -->
  <g filter="url(#glow)">
    <!-- Main Flow Checkmark with Arrow Head -->
    <path d="M 155,260 L 225,330 L 345,175 M 345,175 L 300,180 M 345,175 L 340,220"
          fill="none"
          stroke="url(#checkGrad)"
          stroke-width="36"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>
</svg>
