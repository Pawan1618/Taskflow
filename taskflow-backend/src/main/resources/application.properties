# =============================================
# TaskFlow - Spring Boot Application Properties
# =============================================

# Application Info
spring.application.name=taskflow

# Server Port
server.port=8080

# =============================================
# H2 In-Memory Database (Default - Development)
# =============================================
spring.datasource.url=jdbc:h2:mem:taskflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# JPA / Hibernate Configuration
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# CORS Configuration
# =============================================
# Frontend is served at localhost:5173 in development
app.cors.allowed-origins=http://localhost:5173

