name: TaskFlow CI/CD Pipeline

# Trigger: runs on every push or PR to the main branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  # ============================================================
  # Job 1: Build & Test the Spring Boot Backend
  # ============================================================
  build-backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven & run tests
        working-directory: taskflow-backend
        run: mvn clean verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: taskflow-backend/target/surefire-reports/

  # ============================================================
  # Job 2: Build the Docker Image for the Backend
  # (Only runs after the build-backend job passes)
  # ============================================================
  docker-build-backend:
    name: Build Backend Docker Image
    runs-on: ubuntu-latest
    needs: build-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push — CI validation only)
        uses: docker/build-push-action@v5
        with:
          context: ./taskflow-backend
          file: ./taskflow-backend/Dockerfile
          push: false
          tags: taskflow-backend:latest

  # ============================================================
  # Job 3: Build the React Frontend
  # ============================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: taskflow-frontend/package-lock.json

      - name: Install dependencies
        working-directory: taskflow-frontend
        run: npm ci

      - name: Build frontend
        working-directory: taskflow-frontend
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: taskflow-frontend/dist/
